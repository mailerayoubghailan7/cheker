<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Email Subject Generator - Generate realistic email subjects with AI">
  <title>Email Subject Generator</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📬</text></svg>">
</head>
<body>
  <div id="toast-container" aria-live="polite"></div>

  <header class="header">
    <div class="header-left">
      <div class="logo">
        <svg class="logo-icon" width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="36" height="36" rx="10" fill="url(#logo-gradient)"/>
          <path d="M10 13L18 18L26 13" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="8" y="11" width="20" height="14" rx="2" stroke="white" stroke-width="1.5" fill="none"/>
          <circle cx="26" cy="11" r="4" fill="#10b981" stroke="white" stroke-width="1"/>
          <text x="26" y="13.5" text-anchor="middle" fill="white" font-size="6" font-weight="bold">AI</text>
          <defs>
            <linearGradient id="logo-gradient" x1="0" y1="0" x2="36" y2="36">
              <stop stop-color="#3b82f6"/>
              <stop offset="1" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="logo-text">
          <h1>Email Subject Generator</h1>
          <p class="subtitle">Generate realistic email subjects with AI</p>
        </div>
      </div>
    </div>
    <div class="header-right">
      <button id="theme-toggle" class="icon-btn" title="Toggle Theme (Ctrl+D)" aria-label="Toggle theme">
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="main">
    <!-- Left: Generator Settings -->
    <section class="panel glass">
      <div class="panel-header">
        <h2>Generator Settings</h2>
      </div>

      <div class="gen-form">
        <div class="gen-field">
          <label for="gen-topic">Topic</label>
          <input type="text" id="gen-topic" placeholder="e.g. meeting reminders, invoices, promotions..." autocomplete="off">
        </div>

        <div class="gen-row">
          <div class="gen-field">
            <label for="gen-count">Count</label>
            <input type="number" id="gen-count" value="10" min="1" max="50">
          </div>
          <div class="gen-field">
            <label for="gen-tone">Tone</label>
            <select id="gen-tone">
              <option value="professional">Professional</option>
              <option value="casual">Casual</option>
              <option value="urgent">Urgent</option>
              <option value="friendly">Friendly</option>
              <option value="formal">Formal</option>
            </select>
          </div>
          <div class="gen-field">
            <label for="gen-length">Length</label>
            <select id="gen-length">
              <option value="short">Short</option>
              <option value="medium" selected>Medium</option>
              <option value="long">Long</option>
            </select>
          </div>
        </div>

        <label class="gen-checkbox">
          <input type="checkbox" id="gen-emoji">
          <span class="check-box">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
          <span>Include emojis</span>
        </label>

        <button type="button" id="btn-generate" class="btn btn-primary btn-generate">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/><path d="M6 6l12 12M18 6l-12 12"/></svg>
          Generate Subjects
        </button>
      </div>
    </section>

    <!-- Right: Results -->
    <section class="panel glass">
      <div class="panel-header">
        <h2>Generated Subjects</h2>
        <span class="subject-count" id="input-count">0 subjects</span>
      </div>

      <textarea id="subject-input" class="subject-textarea" placeholder="Generated subjects will appear here...&#10;&#10;Enter a topic and click Generate to start." rows="16"></textarea>

      <div class="result-actions">
        <button type="button" id="btn-copy" class="btn btn-outline">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy
        </button>
        <button type="button" id="btn-download" class="btn btn-outline">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download
        </button>
        <button type="button" id="btn-clear" class="btn btn-ghost">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Clear
        </button>
      </div>

      <div class="shortcut-hint">
        <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to generate
      </div>
    </section>
  </main>

  <div id="loading-overlay" class="loading-overlay" aria-hidden="true">
    <div class="loader">
      <div class="loader-ring"></div>
    </div>
    <p class="loader-text">Generating subjects...</p>
  </div>

  <script src="/app.js"></script>
</body>
</html>
